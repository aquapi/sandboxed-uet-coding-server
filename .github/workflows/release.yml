name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            executable: server-linux-x64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            executable: server-linux-arm64
          - os: windows-latest
            artifact: windows-x64
            executable: server-windows-x64.exe
          - os: macos-latest
            artifact: macos-arm64
            executable: server-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build executable
        run: uv run pyinstaller --onefile --name ${{ matrix.executable }} server.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.executable }}
          path: dist/${{ matrix.executable }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all executables
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
